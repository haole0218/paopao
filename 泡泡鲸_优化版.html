<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04101f">
<title>泡泡鲸</title>
<style>
:root{
  --c1:#7ee8ff; --c2:#ff8ab3; --c3:#c3a6ff;
  --card:rgba(255,255,255,.055);
  --card-line:rgba(160,225,255,.10);
  --txt-dim:rgba(234,247,255,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:#04101f;color:#eaf7ff;user-select:none;-webkit-user-select:none;
}
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow:hidden}
#bg{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block}
.vignette{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 34%,transparent 26%,rgba(2,8,18,.62) 100%);
}

/* ================= HUD ================= */
.hud{
  position:relative;z-index:3;flex:none;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(13px + env(safe-area-inset-top)) 18px 0;
}
.pet-id{display:flex;align-items:center;gap:10px}
.avatar{
  width:38px;height:38px;border-radius:13px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:linear-gradient(150deg,rgba(126,232,255,.26),rgba(45,127,249,.15));
  border:1px solid rgba(160,230,255,.26);
  box-shadow:0 4px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28);
  animation:avatarGlow 4s ease-in-out infinite;
}
@keyframes avatarGlow{
  0%,100%{box-shadow:0 4px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
  50%{box-shadow:0 4px 24px rgba(90,200,255,.5),inset 0 1px 0 rgba(255,255,255,.28)}
}
.pet-meta b{display:block;font-size:14.5px;letter-spacing:.6px;font-weight:700;line-height:1.2}
.pet-meta span{display:block;font-size:9.5px;letter-spacing:1.2px;color:var(--c1);opacity:.82;margin-top:2px}
.exp-pill{
  display:flex;align-items:center;gap:7px;
  padding:6px 13px;border-radius:99px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(160,225,255,.15);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.exp-pill .bar{width:42px;height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.exp-pill .bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#8df0ff,#4aa8ff);transition:width .5s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 8px rgba(120,220,255,.8)}
.exp-pill em{font-style:normal;font-size:9px;letter-spacing:.4px;opacity:.6;font-variant-numeric:tabular-nums}

/* ================= Pages 容器 ================= */
.pages{position:relative;z-index:2;flex:1;min-height:0;overflow:hidden}
.page{
  position:absolute;inset:0;
  display:flex;flex-direction:column;min-height:0;
  opacity:0;transform:translateY(10px) scale(.99);
  pointer-events:none;
  transition:opacity .26s ease,transform .3s cubic-bezier(.34,1.2,.64,1);
}
.page.active{opacity:1;transform:none;pointer-events:auto}

/* ---------- 互动页 ---------- */
/* 圆环状态 */
.rings{
  flex:none;display:flex;justify-content:space-around;align-items:flex-start;
  padding:8px 14px 6px;
}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.ring-box{position:relative;width:56px;height:56px}
.ring-box svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring-track{fill:none;stroke:rgba(255,255,255,.075);stroke-width:5.5}
.ring-prog{fill:none;stroke-width:5.5;stroke-linecap:round;
  transition:stroke-dasharray .62s cubic-bezier(.4,0,.2,1)}
.ring-ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:19px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.4))}
.ring-val{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.ring-name{font-size:8.5px;opacity:.46;letter-spacing:.6px;margin-top:-1px}
.ring-item[data-key="hunger"] .ring-prog{stroke:#ffb347}
.ring-item[data-key="mood"] .ring-prog{stroke:#ff6b9d}
.ring-item[data-key="clean"] .ring-prog{stroke:#4fc3f7}
.ring-item[data-key="energy"] .ring-prog{stroke:#a78bfa}
.ring-item.low .ring-prog{animation:lowPulse 1.15s ease-in-out infinite}
.ring-item.low .ring-val{color:#ff8f8f}
@keyframes lowPulse{0%,100%{opacity:1}50%{opacity:.32}}

/* 鲸鱼舞台 */
.stage{
  position:relative;flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:2px 0 4px;
}
.stage::after{
  content:'';position:absolute;left:50%;bottom:16%;transform:translateX(-50%);
  width:160px;height:24px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(120,220,255,.3),transparent 72%);
  filter:blur(8px);pointer-events:none;z-index:0;
}
.whale-holder{
  position:relative;z-index:1;
  height:min(100%,185px);
  aspect-ratio:340/280;max-width:84%;
  animation:bob 4.6s ease-in-out infinite;will-change:transform;
  cursor:pointer;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.whale{width:100%;height:100%;display:block;overflow:visible}
.tail{transform-box:view-box;transform-origin:268px 142px;animation:sway 2.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
.fin{transform-box:view-box;transform-origin:130px 184px;animation:finWave 3.4s ease-in-out infinite}
@keyframes finWave{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(11deg)}}
#eyeBlink{transform-box:fill-box;transform-origin:center;transition:transform .09s ease}
#eyeBlink.blink{transform:scaleY(.07)}
.whale.sleeping #eyeBlink{transform:scaleY(.07)}
#mouth{transform-box:fill-box;transform-origin:center;transition:transform .16s cubic-bezier(.34,1.5,.64,1)}
#mouth.eating{transform:scale(1.15,2)}
.whale.sleeping{filter:saturate(.72) brightness(.88)}

/* 动作按钮 */
.actions{
  flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:4px 16px 12px;
}
.act{
  position:relative;overflow:hidden;cursor:pointer;
  height:56px;border-radius:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:#eaf7ff;font-family:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.03));
  border:1px solid rgba(180,235,255,.14);
  box-shadow:0 4px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.24);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s,box-shadow .2s,opacity .2s;
}
.act .ic{font-size:19px;line-height:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4));transition:transform .2s}
.act .tx{font-size:9px;letter-spacing:.5px;opacity:.8}
.act:active{transform:scale(.91)}
.act:active .ic{transform:scale(1.18)}
.act.on{
  background:linear-gradient(180deg,rgba(126,232,255,.34),rgba(45,127,249,.2));
  border-color:rgba(150,235,255,.5);
  box-shadow:0 0 22px rgba(90,200,255,.4),inset 0 1px 0 rgba(255,255,255,.4);
}
.act.dim{opacity:.38}
.act.dim:active{transform:scale(.97)}
.act::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.75),transparent 62%);
  opacity:0;transform:scale(.3);
}
.act.pulse::after{animation:ripple .5s ease-out}
@keyframes ripple{0%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:scale(1.8)}}

/* ---------- 通用页头 ---------- */
.page-head{
  flex:none;padding:14px 22px 10px;
}
.page-head h2{font-size:22px;font-weight:800;letter-spacing:.6px;line-height:1.2}
.page-head p{font-size:11px;color:var(--txt-dim);margin-top:5px;letter-spacing:.3px}

/* ---------- 记录页 ---------- */
.log-scroll{
  flex:1;min-height:0;overflow-y:auto;
  padding:0 18px 20px;
  scrollbar-width:none;
}
.log-scroll::-webkit-scrollbar{width:0;display:none}
.log-group{
  font-size:10.5px;letter-spacing:1.4px;color:var(--txt-dim);
  padding:14px 4px 7px;font-weight:600;
}
.log-group:first-child{padding-top:4px}
.log-item{
  display:flex;align-items:center;gap:11px;
  padding:11px 13px;margin-bottom:6px;
  border-radius:14px;
  background:var(--card);
  border:1px solid var(--card-line);
  animation:logIn .34s cubic-bezier(.34,1.3,.64,1) both;
}
@keyframes logIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.log-em{font-size:16px;flex:none;line-height:1}
.log-tx{flex:1;font-size:12px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-tm{font-size:10px;opacity:.4;flex:none;font-variant-numeric:tabular-nums}
.log-empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  opacity:.4;font-size:12px;letter-spacing:.6px;
}
.log-empty .e{font-size:30px}

/* ---------- 信息页 ---------- */
.info-scroll{
  flex:1;min-height:0;overflow-y:auto;
  padding:0 18px 22px;
  scrollbar-width:none;
}
.info-scroll::-webkit-scrollbar{width:0;display:none}

.profile-card{
  display:flex;align-items:center;gap:15px;
  padding:18px;border-radius:22px;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(126,232,255,.15),rgba(195,166,255,.07) 60%,rgba(255,138,179,.06));
  border:1px solid rgba(160,225,255,.16);
  box-shadow:0 8px 28px rgba(0,0,0,.28);
}
.profile-ava{
  width:62px;height:62px;border-radius:20px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:32px;
  background:linear-gradient(150deg,rgba(126,232,255,.3),rgba(45,127,249,.15));
  border:1px solid rgba(160,230,255,.3);
  box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.32);
}
.profile-info{flex:1;min-width:0}
.profile-info h3{font-size:18px;font-weight:800;letter-spacing:.8px;margin-bottom:4px}
.profile-tag{
  display:inline-block;font-size:9.5px;letter-spacing:.6px;
  padding:3px 9px;border-radius:99px;margin-bottom:8px;
  background:rgba(126,232,255,.16);color:#a9efff;
  border:1px solid rgba(126,232,255,.24);
}
.profile-exp{display:flex;align-items:center;gap:8px}
.profile-exp .track{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.profile-exp .track i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#8df0ff,#4aa8ff);transition:width .55s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 10px rgba(120,220,255,.7)}
.profile-exp em{font-style:normal;font-size:9.5px;opacity:.55;flex:none;font-variant-numeric:tabular-nums}

.section-title{
  font-size:10.5px;letter-spacing:1.4px;color:var(--txt-dim);font-weight:600;
  padding:8px 4px 9px;
}

.stat-card{
  display:flex;flex-direction:column;gap:11px;
  padding:15px 16px;border-radius:18px;margin-bottom:14px;
  background:var(--card);border:1px solid var(--card-line);
}
.stat-line{display:flex;align-items:center;gap:11px}
.stat-line .si{font-size:15px;flex:none;width:20px;text-align:center}
.stat-line .sn{font-size:11.5px;opacity:.72;width:38px;flex:none;letter-spacing:.3px}
.stat-line .st{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.stat-line .st i{display:block;height:100%;border-radius:99px;transition:width .55s cubic-bezier(.4,0,.2,1)}
.stat-line .sv{font-size:11px;font-weight:700;width:26px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.stat-line .st i.low{animation:lowPulse 1.15s ease-in-out infinite}

.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.data-cell{
  padding:14px 15px;border-radius:17px;
  background:var(--card);border:1px solid var(--card-line);
}
.data-cell .dl{font-size:9.5px;letter-spacing:.8px;opacity:.48;margin-bottom:6px}
.data-cell .dv{font-size:19px;font-weight:800;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.data-cell .dv small{font-size:10px;font-weight:500;opacity:.5;margin-left:3px;letter-spacing:.2px}

/* ================= Tabbar ================= */
.tabbar{
  position:relative;z-index:4;flex:none;
  display:flex;align-items:center;gap:5px;
  padding:8px 16px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(8,24,44,.55),rgba(4,14,28,.94));
  border-top:1px solid rgba(140,220,255,.1);
  backdrop-filter:blur(26px) saturate(1.5);
  -webkit-backdrop-filter:blur(26px) saturate(1.5);
  box-shadow:0 -10px 34px rgba(0,0,0,.45);
}
.tab{
  flex:1;position:relative;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0;border-radius:15px;border:none;background:transparent;
  color:#eaf7ff;font-family:inherit;opacity:.4;
  transition:opacity .22s,background .22s,transform .15s;
}
.tab .ti{font-size:17px;line-height:1}
.tab .tt{font-size:9px;letter-spacing:1.2px}
.tab.active{opacity:1;background:rgba(126,232,255,.1)}
.tab.active .tt{color:var(--c1)}
.tab:active{transform:scale(.93)}

/* ================= 动态元素 ================= */
.fx-layer{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.food{position:absolute;font-size:20px;will-change:transform;filter:drop-shadow(0 0 9px rgba(255,205,130,.85))}
.heart{position:absolute;font-size:16px;will-change:transform,opacity;pointer-events:none}
.zzz{position:absolute;font-size:15px;font-weight:800;color:#a8e6ff;
  text-shadow:0 0 12px rgba(120,220,255,.9);pointer-events:none}
.soap{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(180,240,255,.35) 45%,rgba(120,200,255,.05) 100%);
  border:1px solid rgba(210,245,255,.6);
  box-shadow:0 0 12px rgba(150,230,255,.55)}
.note{position:absolute;font-size:18px;pointer-events:none;will-change:transform,opacity;
  filter:drop-shadow(0 0 10px rgba(195,166,255,.9))}
.spark{position:absolute;font-size:15px;pointer-events:none;will-change:transform,opacity;
  filter:drop-shadow(0 0 8px rgba(255,240,180,.9))}

.flash{position:absolute;inset:0;z-index:40;pointer-events:none;background:#fff;opacity:0}
.flash.go{animation:flashAnim .45s ease-out}
@keyframes flashAnim{0%{opacity:.82}100%{opacity:0}}

.toast{
  position:absolute;left:50%;top:15%;z-index:50;pointer-events:none;
  padding:9px 20px;border-radius:99px;white-space:nowrap;
  background:rgba(10,35,60,.9);
  border:1px solid rgba(140,220,255,.3);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:12px;color:#cfeeff;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;transform:translate(-50%,12px) scale(.94);
  transition:all .32s cubic-bezier(.34,1.45,.64,1);
}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ===== 新增：成长工具与设置 ===== */
.feature-card{padding:15px 16px;border-radius:18px;margin-bottom:12px;background:var(--card);border:1px solid var(--card-line)}
.feature-card h4{font-size:13px;margin-bottom:7px;letter-spacing:.3px}
.feature-card p{font-size:10.5px;line-height:1.6;color:var(--txt-dim);margin-bottom:11px}
.feature-actions{display:flex;flex-wrap:wrap;gap:8px}
.feature-btn{border:1px solid rgba(160,225,255,.2);background:rgba(126,232,255,.09);color:#eaf7ff;border-radius:11px;padding:9px 11px;font:inherit;font-size:11px;cursor:pointer}
.feature-btn:active{transform:scale(.97)}\n.feature-btn:focus-visible,.act:focus-visible,.tab:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
.feature-btn.primary{background:linear-gradient(120deg,rgba(126,232,255,.28),rgba(74,168,255,.18));border-color:rgba(126,232,255,.4)}
.feature-btn.danger{background:rgba(255,110,130,.09);border-color:rgba(255,110,130,.25)}
.feature-note{font-size:10px;color:var(--txt-dim);margin-top:9px;line-height:1.5}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <canvas id="bg"></canvas>
  <div class="vignette"></div>

  <!-- HUD -->
  <header class="hud">
    <div class="pet-id">
      <div class="avatar">🐳</div>
      <div class="pet-meta">
        <b id="petName">泡泡</b>
        <span id="petLv">LV.1 · 幼鲸</span>
      </div>
    </div>
    <div class="exp-pill">
      <div class="bar"><i id="expFill"></i></div>
      <em id="expTxt">0/100</em>
    </div>
  </header>

  <!-- Pages -->
  <div class="pages">

    <!-- 互动页 -->
    <section class="page active" data-page="play">
      <div class="rings" id="rings"></div>

      <div class="stage" id="stage">
        <div class="whale-holder" id="whaleHolder">
          <svg class="whale" id="whale" viewBox="0 0 340 280" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="gBody" cx="34%" cy="24%" r="86%">
                <stop offset="0%" stop-color="#dcfbff"/>
                <stop offset="28%" stop-color="#8ee9ff"/>
                <stop offset="60%" stop-color="#45b6f5"/>
                <stop offset="100%" stop-color="#1a6cc4"/>
              </radialGradient>
              <linearGradient id="gTail" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#8ce2ff"/>
                <stop offset="55%" stop-color="#3aa8ee"/>
                <stop offset="100%" stop-color="#1f76c8"/>
              </linearGradient>
              <linearGradient id="gFin" x1="0" y1="0" x2=".4" y2="1">
                <stop offset="0%" stop-color="#a8ecff"/>
                <stop offset="100%" stop-color="#2a86d8"/>
              </linearGradient>
              <linearGradient id="gBelly" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
                <stop offset="52%" stop-color="#e8fbff" stop-opacity=".78"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity=".97"/>
              </linearGradient>
              <radialGradient id="gShine">
                <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </radialGradient>
              <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="10" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <clipPath id="clipBody">
                <path d="M 270 130 C 268 90,218 60,156 60 C 92 60,52 100,52 144 C 52 188,92 226,156 226 C 218 226,268 194,270 154 Z"/>
              </clipPath>
            </defs>

            <ellipse cx="158" cy="150" rx="132" ry="106" fill="#4fc3f7" opacity=".13" filter="url(#softGlow)"/>

            <g class="tail" id="tail">
              <path d="M 264 122 C 286 108,302 84,310 58 C 320 86,314 116,292 136 C 314 156,320 186,310 214 C 302 188,286 164,264 152 Z"
                    fill="url(#gTail)"/>
            </g>

            <path d="M 270 130 C 268 90,218 60,156 60 C 92 60,52 100,52 144 C 52 188,92 226,156 226 C 218 226,268 194,270 154 Z"
                  fill="url(#gBody)"/>

            <ellipse cx="150" cy="240" rx="146" ry="74" fill="url(#gBelly)" clip-path="url(#clipBody)"/>

            <ellipse cx="112" cy="104" rx="46" ry="26" fill="url(#gShine)" transform="rotate(-22 112 104)"/>
            <ellipse cx="168" cy="80" rx="26" ry="11" fill="url(#gShine)" opacity=".7" transform="rotate(-14 168 80)"/>

            <g class="fin" id="fin">
              <path d="M 126 176 C 104 190,96 214,110 230 C 126 244,152 234,156 210 C 158 196,148 182,126 176 Z"
                    fill="url(#gFin)"/>
              <path d="M 126 176 C 112 186,106 202,112 218" stroke="rgba(255,255,255,.4)" stroke-width="2"
                    fill="none" stroke-linecap="round"/>
            </g>

            <ellipse cx="86" cy="147" rx="9.5" ry="5.5" fill="#ff8ab3" opacity=".38"/>

            <g id="eyeFollow">
              <g id="eyeBlink">
                <ellipse cx="104" cy="126" rx="12" ry="14" fill="#08243f"/>
                <circle cx="99" cy="120" r="4.6" fill="#ffffff"/>
                <circle cx="110" cy="133" r="2.2" fill="#ffffff" opacity=".6"/>
              </g>
            </g>

            <path id="mouth" d="M 78 158 Q 94 172 112 160"
                  stroke="#08243f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div class="actions">
        <button class="act" data-act="feed"><span class="ic">🍤</span><span class="tx">喂食</span></button>
        <button class="act" data-act="play"><span class="ic">🎈</span><span class="tx">玩耍</span></button>
        <button class="act" data-act="clean"><span class="ic">🫧</span><span class="tx">洗澡</span></button>
        <button class="act" data-act="sleep" id="btnSleep"><span class="ic">🌙</span><span class="tx">睡觉</span></button>
        <button class="act" data-act="pet"><span class="ic">✋</span><span class="tx">摸摸</span></button>
        <button class="act" data-act="train"><span class="ic">🎯</span><span class="tx">训练</span></button>
        <button class="act" data-act="sing"><span class="ic">🎵</span><span class="tx">唱歌</span></button>
        <button class="act" data-act="photo"><span class="ic">📷</span><span class="tx">拍照</span></button>
      </div>
    </section>

    <!-- 记录页 -->
    <section class="page" data-page="log">
      <div class="page-head">
        <h2>互动记录</h2>
        <p id="logSub">今天还没有互动过</p>
      </div>
      <div class="log-scroll" id="logList"></div>
    </section>

    <!-- 信息页 -->
    <section class="page" data-page="info">
      <div class="page-head">
        <h2>宠物信息</h2>
        <p id="infoSub">泡泡鲸的成长档案</p>
      </div>
      <div class="info-scroll" id="infoBody"></div>
    </section>

  </div>

  <!-- Tabbar -->
  <nav class="tabbar">
    <button class="tab active" data-tab="play"><span class="ti">🎮</span><span class="tt">互动</span></button>
    <button class="tab" data-tab="log"><span class="ti">📜</span><span class="tt">记录</span></button>
    <button class="tab" data-tab="info"><span class="ti">📖</span><span class="tt">信息</span></button>
  </nav>

  <div class="fx-layer" id="fxLayer"></div>
  <div class="flash" id="flash"></div>
</div>

<script>
(function(){
'use strict';

/* ==================== 工具 ==================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = v => Math.max(0, Math.min(100, v));
const rand = (a,b) => a + Math.random()*(b-a);
const pad2 = n => String(n).padStart(2,'0');
const fmtTime = t => { const d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };

/* ==================== 状态 ==================== */
const state = {
  name: '泡泡',
  hunger: 78, mood: 82, clean: 90, energy: 72,
  level: 1, exp: 0,
  sleeping: false,
  birth: Date.now(),
  total: 0,
  lastReward: '',
  soundOn: true,
  logs: []
};

const STAT_DEFS = [
  { key:'hunger', name:'饱食', icon:'🍤', color:'linear-gradient(90deg,#ffd18a,#ffab4a)', ring:'#ffb347' },
  { key:'mood',   name:'心情', icon:'💖', color:'linear-gradient(90deg,#ffb0d0,#ff5f9e)', ring:'#ff6b9d' },
  { key:'clean',  name:'清洁', icon:'🫧', color:'linear-gradient(90deg,#a6f0ff,#4fc3f7)', ring:'#4fc3f7' },
  { key:'energy', name:'精力', icon:'⚡', color:'linear-gradient(90deg,#cdb8ff,#9a7bff)', ring:'#a78bfa' }
];

const RING_R = 27;
const RING_C = 2 * Math.PI * RING_R;

/* ==================== DOM ==================== */
const appEl       = $('.app');
const stage       = $('#stage');
const fxLayer     = $('#fxLayer');
const whale       = $('#whale');
const whaleHolder = $('#whaleHolder');
const eyeFollow   = $('#eyeFollow');
const eyeBlink    = $('#eyeBlink');
const mouth       = $('#mouth');
const btnSleep    = $('#btnSleep');
const petLv       = $('#petLv');
const expFill     = $('#expFill');
const expTxt      = $('#expTxt');
const ringsEl     = $('#rings');
const logList     = $('#logList');
const logSub      = $('#logSub');
const infoBody    = $('#infoBody');
const flashEl     = $('#flash');

/* ==================== 音效 ==================== */
let actx = null;
function beep(freq, dur, type, vol){
  if(!state.soundOn) return;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 1.55, t + dur);
    g.gain.setValueAtTime(vol || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}

/* ==================== 存档 ==================== */
const SAVE_KEY = 'bubbleWhale_v4';
function save(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      name: state.name, hunger: state.hunger, mood: state.mood, clean: state.clean,
      energy: state.energy, level: state.level, exp: state.exp, birth: state.birth,
      total: state.total, lastReward: state.lastReward, soundOn: state.soundOn, logs: state.logs.slice(0, 50)
    }));
  }catch(e){}
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if(s && typeof s === 'object'){
      Object.keys(s).forEach(k => { if(k in state) state[k] = s[k]; });
      ['hunger','mood','clean','energy'].forEach(k => {
        const v = Number(state[k]); state[k] = Number.isFinite(v) ? clamp(v) : 70;
      });
      state.level = Math.max(1, Math.floor(Number(state.level) || 1));
      state.exp = Math.max(0, Number(state.exp) || 0);
      state.total = Math.max(0, Math.floor(Number(state.total) || 0));
      if(!Array.isArray(state.logs)) state.logs = [];
      state.logs = state.logs.filter(l => l && Number.isFinite(Number(l.t))).slice(0, 60);
      state.name = String(state.name || '泡泡').slice(0, 16);
      state.sleeping = false;
    }
  }catch(e){}
  if(!state.logs.length){
    state.logs = [{ em:'👋', tx:'泡泡鲸来到了你的身边', t: Date.now() }];
  }
}

/* ==================== Toast ==================== */
let toastEl = null, toastTimer = null;
function toast(msg){
  if(toastEl) toastEl.remove();
  if(toastTimer) clearTimeout(toastTimer);
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  appEl.appendChild(el);
  toastEl = el;
  requestAnimationFrame(() => el.classList.add('show'));
  toastTimer = setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => { if(el.parentNode) el.remove(); }, 340);
  }, 1600);
}

/* ==================== 经验 ==================== */
function needExp(){ return 100 + (state.level - 1) * 60; }

function addExp(n){
  state.exp += n;
  let need = needExp();
  while(state.exp >= need){
    state.exp -= need;
    state.level++;
    need = needExp();
    setTimeout(() => {
      toast('✨ 升级啦！Lv.' + state.level);
      beep(880, .18, 'triangle', .06);
      setTimeout(() => beep(1180, .22, 'triangle', .05), 110);
      bubbleBurst(24);
      log('⬆️', '等级提升至 Lv.' + state.level);
    }, 240);
  }
  renderTop();
}

function renderTop(){
  const need = needExp();
  const pct = Math.min(100, state.exp / need * 100);
  expFill.style.width = pct + '%';
  expTxt.textContent = Math.floor(state.exp) + '/' + need;
  const titles = ['幼鲸','小鲸','游鲸','浪鲸','星鲸','潮鲸','深海鲸'];
  const t = titles[Math.min(titles.length - 1, Math.floor((state.level - 1) / 3))];
  petLv.textContent = 'LV.' + state.level + ' · ' + t;
}

/* ==================== 圆环 ==================== */
function buildRings(){
  ringsEl.innerHTML = STAT_DEFS.map(d =>
    '<div class="ring-item" data-key="' + d.key + '">' +
      '<div class="ring-box">' +
        '<svg viewBox="0 0 64 64">' +
          '<circle class="ring-track" cx="32" cy="32" r="' + RING_R + '"/>' +
          '<circle class="ring-prog" cx="32" cy="32" r="' + RING_R + '" ' +
            'stroke-dasharray="0 ' + RING_C.toFixed(2) + '"/>' +
        '</svg>' +
        '<span class="ring-ic">' + d.icon + '</span>' +
      '</div>' +
      '<div class="ring-val">0</div>' +
      '<div class="ring-name">' + d.name + '</div>' +
    '</div>'
  ).join('');
}

function renderRings(){
  STAT_DEFS.forEach(d => {
    const el = ringsEl.querySelector('[data-key="' + d.key + '"]');
    if(!el) return;
    const v = Math.round(state[d.key]);
    const prog = el.querySelector('.ring-prog');
    prog.style.strokeDasharray = (v/100 * RING_C).toFixed(2) + ' ' + RING_C.toFixed(2);
    el.querySelector('.ring-val').textContent = v;
    el.classList.toggle('low', v < 25);
  });
}

/* ==================== 记录 ==================== */
function log(em, tx){
  state.logs.unshift({ em: em, tx: tx, t: Date.now() });
  if(state.logs.length > 60) state.logs.length = 60;
  state.total++;
  if($('.page[data-page="log"]').classList.contains('active')) renderLogs();
  if($('.page[data-page="info"]').classList.contains('active')) renderInfo();
}

function renderLogs(){
  if(!state.logs.length){
    logList.innerHTML = '<div class="log-empty"><div class="e">🫧</div><div>还没有互动记录哦</div></div>';
    logSub.textContent = '今天还没有互动过';
    return;
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);

  const groups = { '今天': [], '昨天': [], '更早': [] };
  state.logs.forEach(l => {
    if(l.t >= today.getTime()) groups['今天'].push(l);
    else if(l.t >= yest.getTime()) groups['昨天'].push(l);
    else groups['更早'].push(l);
  });

  let html = '';
  ['今天','昨天','更早'].forEach(k => {
    if(!groups[k].length) return;
    html += '<div class="log-group">' + k + '</div>';
    groups[k].forEach(l => {
      html += '<div class="log-item">' +
        '<span class="log-em">' + l.em + '</span>' +
        '<span class="log-tx">' + l.tx + '</span>' +
        '<span class="log-tm">' + fmtTime(l.t) + '</span>' +
      '</div>';
    });
  });
  logList.innerHTML = html;

  const c = groups['今天'].length;
  logSub.textContent = c ? ('今天已互动 ' + c + ' 次 · 累计 ' + state.total + ' 次')
                         : ('累计互动 ' + state.total + ' 次');
}

/* ==================== 信息 ==================== */
function moodLabel(){
  if(state.sleeping) return '安睡';
  if(state.mood > 80) return '超开心';
  if(state.mood > 55) return '愉快';
  if(state.mood > 30) return '一般';
  return '低落';
}

function renderInfo(){
  const need = needExp();
  const pct = Math.min(100, state.exp / need * 100);
  const bd = new Date(state.birth);
  const birthStr = (bd.getMonth()+1) + '月' + bd.getDate() + '日';
  const days = Math.max(1, Math.floor((Date.now() - state.birth) / 86400000) + 1);

  const today = new Date(); today.setHours(0,0,0,0);
  const todayCount = state.logs.filter(l => l.t >= today.getTime()).length;
  const titles = ['幼鲸','小鲸','游鲸','浪鲸','星鲸','潮鲸','深海鲸'];
  const t = titles[Math.min(titles.length - 1, Math.floor((state.level - 1) / 3))];

  const statLines = STAT_DEFS.map(d => {
    const v = Math.round(state[d.key]);
    return '<div class="stat-line">' +
      '<span class="si">' + d.icon + '</span>' +
      '<span class="sn">' + d.name + '</span>' +
      '<div class="st"><i class="' + (v < 25 ? 'low' : '') + '" style="width:' + v + '%;background:' + d.color + '"></i></div>' +
      '<span class="sv">' + v + '</span>' +
    '</div>';
  }).join('');

  infoBody.innerHTML =
    '<div class="profile-card">' +
      '<div class="profile-ava">🐳</div>' +
      '<div class="profile-info">' +
        '<h3>' + state.name + '</h3>' +
        '<span class="profile-tag">LV.' + state.level + ' · ' + t + '</span>' +
        '<div class="profile-exp">' +
          '<div class="track"><i style="width:' + pct + '%"></i></div>' +
          '<em>' + Math.floor(state.exp) + '/' + need + '</em>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="section-title">状态</div>' +
    '<div class="stat-card">' + statLines + '</div>' +

    '<div class="section-title">数据</div>' +
    '<div class="data-grid">' +
      '<div class="data-cell"><div class="dl">陪伴天数</div><div class="dv">' + days + '<small>天</small></div></div>' +
      '<div class="data-cell"><div class="dl">累计互动</div><div class="dv">' + state.total + '<small>次</small></div></div>' +
      '<div class="data-cell"><div class="dl">今日互动</div><div class="dv">' + todayCount + '<small>次</small></div></div>' +
      '<div class="data-cell"><div class="dl">心情评级</div><div class="dv" style="font-size:16px">' + moodLabel() + '</div></div>' +
    '</div>' +

    '<div class="section-title">档案</div>' +
    '<div class="stat-card" style="gap:9px">' +
      '<div style="display:flex;justify-content:space-between;font-size:11.5px">' +
        '<span style="opacity:.5">出生日期</span><span>' + birthStr + '</span></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:11.5px">' +
        '<span style="opacity:.5">当前状态</span><span>' + (state.sleeping ? '💤 睡眠中' : '🌊 活跃') + '</span></div>' +
    '</div>' +

    '<div class="section-title">成长工具</div>' +
    '<div class="feature-card">' +
      '<h4>🎁 每日照顾奖励</h4>' +
      '<p>每天领取一次奖励，获得经验和状态补给。连续照顾泡泡，慢慢解锁更高等级。</p>' +
      '<div class="feature-actions"><button class="feature-btn primary" id="dailyRewardBtn">领取今日奖励</button></div>' +
      '<div class="feature-note" id="dailyRewardNote">奖励每天可领取一次。</div>' +
    '</div>' +
    '<div class="feature-card">' +
      '<h4>🪪 宠物个性化</h4>' +
      '<p>给泡泡取一个你喜欢的名字。名字会保存在当前浏览器的存档中。</p>' +
      '<div class="feature-actions"><button class="feature-btn" id="renameBtn">修改名字</button><button class="feature-btn" id="exportBtn">导出存档</button><button class="feature-btn" id="importBtn">导入存档</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>' +
      '<div class="feature-note">存档只保存在本地浏览器。导出文件可用于手动备份或迁移到另一台设备。</div>' +
    '</div>' +
    '<div class="feature-card">' +
      '<h4>⚙️ 数据与设置</h4>' +
      '<p>可切换音效，或在需要时重新开始。重置会清除当前浏览器里的泡泡鲸存档。</p>' +
      '<div class="feature-actions"><button class="feature-btn" id="soundBtn">音效：开启</button><button class="feature-btn danger" id="resetBtn">重置宠物</button></div>' +
    '</div>';
  updateFeatureButtons();
}

/* ==================== 渲染入口 ==================== */
function render(){
  renderTop();
  renderRings();
  updateActions();
  if(state.sleeping) return;
  if(state.mood < 28){
    mouth.setAttribute('d', 'M 78 166 Q 94 152 112 162');
  }else if(state.mood > 72){
    mouth.setAttribute('d', 'M 76 156 Q 94 176 114 158');
  }else{
    mouth.setAttribute('d', 'M 78 158 Q 94 172 112 160');
  }
}

function updateActions(){
  $$('.act').forEach(btn => {
    const a = btn.dataset.act;
    let dim = false;
    if(state.sleeping && a !== 'sleep') dim = true;
    if(a === 'feed' && state.hunger > 96) dim = true;
    if(a === 'play' && state.energy < 14) dim = true;
    if(a === 'clean' && state.clean > 96) dim = true;
    if(a === 'train' && state.energy < 20) dim = true;
    if(a === 'sing' && state.energy < 10) dim = true;
    btn.classList.toggle('dim', dim);
  });
}

/* ==================== 位置 ==================== */
function mouthPos(){
  const pt = whale.createSVGPoint();
  pt.x = 94; pt.y = 162;
  const m = pt.matrixTransform(whale.getScreenCTM());
  const r = fxLayer.getBoundingClientRect();
  return { x: m.x - r.left, y: m.y - r.top, w: r.width, h: r.height };
}
function centerPos(){
  const r = fxLayer.getBoundingClientRect();
  return { x: r.width * 0.44, y: r.height * 0.42, w: r.width, h: r.height };
}

/* ==================== 特效 ==================== */
function heartAt(x, y){
  const el = document.createElement('div');
  el.className = 'heart';
  el.textContent = ['💖','💕','💗','✨','💙'][Math.floor(Math.random()*5)];
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  fxLayer.appendChild(el);
  const dx = rand(-55, 55), rot = rand(-30, 30);
  const a = el.animate([
    { transform:'translate(-50%,-50%) scale(.2) rotate(0deg)', opacity:0 },
    { transform:'translate(calc(-50% + ' + (dx*0.45) + 'px), calc(-50% - 40px)) scale(1.12) rotate(' + rot*0.5 + 'deg)', opacity:1, offset:.38 },
    { transform:'translate(calc(-50% + ' + dx + 'px), calc(-50% - 100px)) scale(.5) rotate(' + rot + 'deg)', opacity:0 }
  ], { duration: 1150, easing:'cubic-bezier(.22,.8,.3,1)', fill:'forwards' });
  a.onfinish = () => el.remove();
}

function spawnFood(cb){
  const m = mouthPos();
  const sx = rand(m.w*0.2, m.w*0.8), sy = -28;
  const el = document.createElement('div');
  el.className = 'food';
  el.textContent = ['🐟','🍤','🦐','🍥','🦑'][Math.floor(Math.random()*5)];
  el.style.left = sx + 'px';
  el.style.top  = sy + 'px';
  fxLayer.appendChild(el);

  const mx = (sx + m.x)/2 + rand(-46, 46);
  const my = sy + (m.y - sy) * 0.45;

  const a = el.animate([
    { transform:'translate(-50%,-50%) scale(.35) rotate(0deg)', opacity:0 },
    { transform:'translate(calc(-50% + ' + (mx-sx) + 'px), calc(-50% + ' + (my-sy) + 'px)) scale(1.05) rotate(140deg)', opacity:1, offset:.45 },
    { transform:'translate(calc(-50% + ' + (m.x-sx) + 'px), calc(-50% + ' + (m.y-sy) + 'px)) scale(.45) rotate(340deg)', opacity:.95 }
  ], { duration: 850, easing:'cubic-bezier(.42,.05,.58,.95)', fill:'forwards' });

  a.onfinish = () => {
    el.remove();
    mouth.classList.add('eating');
    setTimeout(() => mouth.classList.remove('eating'), 420);
    if(cb) cb(m);
  };
}

function bubbleBurst(n){
  const c = centerPos();
  for(let i = 0; i < (n || 16); i++){
    const el = document.createElement('div');
    el.className = 'soap';
    const size = rand(8, 24);
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = c.x + 'px';
    el.style.top  = c.y + 'px';
    fxLayer.appendChild(el);
    const ang = rand(0, Math.PI*2), dist = rand(45, 160);
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 50;
    const a = el.animate([
      { transform:'translate(-50%,-50%) scale(.2)', opacity:0 },
      { transform:'translate(calc(-50% + ' + dx*0.55 + 'px), calc(-50% + ' + dy*0.55 + 'px)) scale(1)', opacity:.95, offset:.3 },
      { transform:'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + (dy - 100) + 'px)) scale(.4)', opacity:0 }
    ], { duration: rand(950, 1650), easing:'cubic-bezier(.2,.7,.3,1)', fill:'forwards' });
    a.onfinish = () => el.remove();
  }
}

function soapBubbles(){
  const c = centerPos();
  for(let i = 0; i < 20; i++){
    const el = document.createElement('div');
    el.className = 'soap';
    const size = rand(10, 30);
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = rand(c.w*0.16, c.w*0.84) + 'px';
    el.style.top  = rand(c.h*0.28, c.h*0.72) + 'px';
    fxLayer.appendChild(el);
    const a = el.animate([
      { transform:'translate(-50%,-50%) scale(.15)', opacity:0 },
      { transform:'translate(-50%,-50%) scale(1)', opacity:.9, offset:.25 },
      { transform:'translate(calc(-50% + ' + rand(-36,36) + 'px), calc(-50% - ' + rand(70,170) + 'px)) scale(.5)', opacity:0 }
    ], { duration: rand(1050, 1950), delay: i*42, easing:'ease-out', fill:'forwards' });
    a.onfinish = () => el.remove();
  }
}

function spawnNote(){
  const c = centerPos();
  const el = document.createElement('div');
  el.className = 'note';
  el.textContent = ['🎵','🎶','♪','♫'][Math.floor(Math.random()*4)];
  el.style.left = rand(c.w*0.3, c.w*0.7) + 'px';
  el.style.top  = rand(c.h*0.28, c.h*0.62) + 'px';
  fxLayer.appendChild(el);
  const a = el.animate([
    { transform:'translate(-50%,-50%) scale(.3) rotate(-10deg)', opacity:0 },
    { transform:'translate(calc(-50% + ' + rand(-26,26) + 'px), calc(-50% - 46px)) scale(1.1) rotate(8deg)', opacity:1, offset:.35 },
    { transform:'translate(calc(-50% + ' + rand(-64,64) + 'px), calc(-50% - 120px)) scale(.6) rotate(-6deg)', opacity:0 }
  ], { duration: 1750, easing:'ease-out', fill:'forwards' });
  a.onfinish = () => el.remove();
}

function sparkles(n){
  const c = centerPos();
  for(let i = 0; i < (n || 14); i++){
    const el = document.createElement('div');
    el.className = 'spark';
    el.textContent = ['✨','⭐','💫'][Math.floor(Math.random()*3)];
    el.style.left = c.x + 'px';
    el.style.top  = c.y + 'px';
    fxLayer.appendChild(el);
    const ang = rand(0, Math.PI*2), dist = rand(36, 140);
    const a = el.animate([
      { transform:'translate(-50%,-50%) scale(0)', opacity:0 },
      { transform:'translate(calc(-50% + ' + Math.cos(ang)*dist*0.6 + 'px), calc(-50% + ' + Math.sin(ang)*dist*0.6 + 'px)) scale(1)', opacity:1, offset:.4 },
      { transform:'translate(calc(-50% + ' + Math.cos(ang)*dist + 'px), calc(-50% + ' + Math.sin(ang)*dist + 'px)) scale(.2)', opacity:0 }
    ], { duration: rand(650, 1150), easing:'ease-out', fill:'forwards' });
    a.onfinish = () => el.remove();
  }
}

let zzzTimer = null;
function spawnZ(){
  if(!state.sleeping) return;
  const m = mouthPos();
  const el = document.createElement('div');
  el.className = 'zzz';
  el.textContent = 'z';
  el.style.left = (m.x + 20) + 'px';
  el.style.top  = (m.y - 80) + 'px';
  fxLayer.appendChild(el);
  const a = el.animate([
    { transform:'translate(-50%,-50%) scale(.4) rotate(-8deg)', opacity:0 },
    { transform:'translate(calc(-50% + 16px), calc(-50% - 28px)) scale(1) rotate(6deg)', opacity:.9, offset:.35 },
    { transform:'translate(calc(-50% + 40px), calc(-50% - 82px)) scale(.6) rotate(14deg)', opacity:0 }
  ], { duration: 1950, easing:'ease-out', fill:'forwards' });
  a.onfinish = () => el.remove();
}
function startZzz(){
  stopZzz();
  zzzTimer = setInterval(spawnZ, 950);
}
function stopZzz(){
  if(zzzTimer){ clearInterval(zzzTimer); zzzTimer = null; }
}

function flashScreen(){
  flashEl.classList.remove('go');
  void flashEl.offsetWidth;
  flashEl.classList.add('go');
}

/* ==================== 互动动作 ==================== */
const ACTS = {
  feed(){
    if(state.sleeping) return toast('它睡着啦，先叫醒它吧');
    if(state.hunger > 96) return toast('已经吃得很饱啦～');
    spawnFood(() => {
      state.hunger = clamp(state.hunger + 17);
      state.mood   = clamp(state.mood + 5);
      state.clean  = clamp(state.clean - 3);
      addExp(10);
      const m = mouthPos();
      heartAt(m.x, m.y - 6);
      beep(430, .13, 'sine', .055);
      setTimeout(() => beep(560, .1, 'sine', .04), 130);
      log('🍤', '喂了泡泡一些好吃的');
      render();
    });
  },
  play(){
    if(state.sleeping) return toast('它睡着啦，先叫醒它吧');
    if(state.energy < 14) return toast('它太累了，先休息一下吧');
    state.mood   = clamp(state.mood + 20);
    state.energy = clamp(state.energy - 13);
    state.hunger = clamp(state.hunger - 6);
    state.clean  = clamp(state.clean - 4);
    addExp(13);
    bubbleBurst(18);
    beep(700, .11, 'triangle', .05);
    setTimeout(() => beep(940, .12, 'triangle', .045), 100);
    log('🎈', '和泡泡一起玩了一会儿');
    render();
  },
  clean(){
    if(state.sleeping) return toast('它睡着啦，先叫醒它吧');
    if(state.clean > 96) return toast('已经干干净净的啦～');
    state.clean = clamp(state.clean + 30);
    state.mood  = clamp(state.mood + 7);
    addExp(8);
    soapBubbles();
    beep(900, .16, 'sine', .05);
    setTimeout(() => beep(1150, .14, 'sine', .04), 130);
    log('🫧', '给泡泡洗了个香香的澡');
    render();
  },
  sleep(){
    state.sleeping = !state.sleeping;
    if(state.sleeping){
      whale.classList.add('sleeping');
      btnSleep.classList.add('on');
      startZzz();
      toast('Zzz… 好好休息');
      beep(300, .3, 'sine', .04);
      log('🌙', '泡泡进入了梦乡');
    }else{
      whale.classList.remove('sleeping');
      btnSleep.classList.remove('on');
      stopZzz();
      state.mood = clamp(state.mood + 4);
      toast('醒啦！精神满满 ✨');
      beep(620, .14, 'sine', .05);
      setTimeout(() => beep(780, .16, 'sine', .045), 120);
      log('☀️', '泡泡醒过来了');
    }
    render();
  },
  pet(){
    if(state.sleeping) return toast('它睡着啦，先叫醒它吧');
    const m = mouthPos();
    heartAt(m.x, m.y - 10);
    state.mood = clamp(state.mood + 9);
    addExp(5);
    beep(660, .09, 'sine', .04);
    log('✋', '轻轻摸了摸泡泡');
    render();
  },
  train(){
    if(state.sleeping) return toast('它睡着啦，先叫醒它吧');
    if(state.energy < 20) return toast('精力不足，先休息一下吧');
    state.energy = clamp(state.energy - 18);
    state.hunger = clamp(state.hunger - 5);
    state.mood   = clamp(state.mood + 4);
    addExp(24);
    sparkles(14);
    beep(520, .1, 'triangle', .05);
    setTimeout(() => beep(700, .1, 'triangle', .045), 90);
    setTimeout(() => beep(880, .14, 'triangle', .04), 180);
    log('🎯', '和泡泡完成了一次训练');
    render();
  },
  sing(){
    if(state.sleeping) return toast('它睡着啦，先叫醒它吧');
    if(state.energy < 10) return toast('它太累了，唱不动啦');
    state.mood   = clamp(state.mood + 15);
    state.energy = clamp(state.energy - 8);
    addExp(11);
    for(let i = 0; i < 6; i++) setTimeout(spawnNote, i * 125);
    beep(620, .14, 'sine', .045);
    setTimeout(() => beep(780, .14, 'sine', .04), 150);
    setTimeout(() => beep(930, .18, 'sine', .035), 300);
    log('🎵', '给泡泡唱了一首歌');
    render();
  },
  photo(){
    if(state.sleeping) return toast('它睡着啦，先叫醒它吧');
    flashScreen();
    state.mood = clamp(state.mood + 6);
    addExp(6);
    beep(1200, .07, 'square', .03);
    setTimeout(() => beep(1500, .07, 'square', .025), 70);
    log('📷', '拍下了一张泡泡的照片');
    render();
  }
};

$$('.act').forEach(btn => {

/* ==================== 成长工具：每日奖励、改名、备份与设置 ==================== */
function dayKey(d){
  const x = d || new Date();
  return x.getFullYear() + '-' + pad2(x.getMonth()+1) + '-' + pad2(x.getDate());
}
function updateFeatureButtons(){
  const rewardBtn = $('#dailyRewardBtn');
  const rewardNote = $('#dailyRewardNote');
  if(rewardBtn && rewardNote){
    const claimed = state.lastReward === dayKey();
    rewardBtn.disabled = claimed;
    rewardBtn.style.opacity = claimed ? '.5' : '1';
    rewardBtn.textContent = claimed ? '今日已领取' : '领取今日奖励';
    rewardNote.textContent = claimed ? '今天的奖励已经领取，明天再来看看泡泡吧。' : '奖励：+20 经验、+8 心情、+8 精力。';
  }
  const soundBtn = $('#soundBtn');
  if(soundBtn) soundBtn.textContent = '音效：' + (state.soundOn ? '开启' : '关闭');
}
infoBody.addEventListener('click', async e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  if(btn.id === 'dailyRewardBtn'){
    if(state.lastReward === dayKey()) return toast('今天已经领过奖励啦');
    state.lastReward = dayKey();
    state.mood = clamp(state.mood + 8);
    state.energy = clamp(state.energy + 8);
    addExp(20);
    log('🎁', '领取了每日照顾奖励');
    toast('奖励到账！泡泡很开心');
    render(); renderInfo(); save();
  }else if(btn.id === 'renameBtn'){
    const value = prompt('给泡泡取个新名字（最多 16 个字）：', state.name);
    if(value === null) return;
    const name = value.trim().slice(0,16);
    if(!name) return toast('名字不能为空哦');
    state.name = name;
    $('#petName').textContent = name;
    log('🪪', '把泡泡的名字改成了 ' + name);
    renderInfo(); renderLogs(); save(); toast('新名字已保存');
  }else if(btn.id === 'exportBtn'){
    save();
    const data = {
      app: '泡泡鲸', version: 1, exportedAt: new Date().toISOString(),
      save: JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')
    };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '泡泡鲸存档-' + dayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('存档文件已导出');
  }else if(btn.id === 'importBtn'){
    $('#importFile').click();
  }else if(btn.id === 'soundBtn'){
    state.soundOn = !state.soundOn;
    updateFeatureButtons(); save();
    if(state.soundOn) beep(660,.08,'sine',.035);
    toast('音效已' + (state.soundOn ? '开启' : '关闭'));
  }else if(btn.id === 'resetBtn'){
    if(!confirm('确定要重新开始吗？当前宠物进度和互动记录会被清除。建议先导出存档。')) return;
    localStorage.removeItem(SAVE_KEY);
    state.name='泡泡'; state.hunger=78; state.mood=82; state.clean=90; state.energy=72;
    state.level=1; state.exp=0; state.sleeping=false; state.birth=Date.now();
    state.total=0; state.lastReward=''; state.logs=[{em:'👋',tx:'泡泡鲸重新来到了你的身边',t:Date.now()}];
    whale.classList.remove('sleeping'); btnSleep.classList.remove('on'); stopZzz();
    $('#petName').textContent=state.name;
    render(); renderLogs(); renderInfo(); save(); toast('泡泡鲸已经重新开始');
  }
});
infoBody.addEventListener('change', e => {
  if(e.target.id !== 'importFile' || !e.target.files || !e.target.files[0]) return;
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(String(reader.result || '{}'));
      const incoming = parsed.save && typeof parsed.save === 'object' ? parsed.save : parsed;
      if(!incoming || typeof incoming !== 'object' ||
         !['hunger','mood','clean','energy','level','exp'].some(k => k in incoming)){
        throw new Error('invalid save');
      }
      if(!confirm('导入存档会覆盖当前进度，确定继续吗？')) return;
      const safe = {};
      ['name','hunger','mood','clean','energy','level','exp','birth','total','lastReward','soundOn','logs'].forEach(k => {
        if(k in incoming) safe[k] = incoming[k];
      });
      localStorage.setItem(SAVE_KEY, JSON.stringify(safe));
      load();
      $('#petName').textContent = state.name;
      whale.classList.remove('sleeping'); btnSleep.classList.remove('on'); stopZzz();
      render(); renderLogs(); renderInfo(); save(); toast('存档导入成功');
    }catch(err){ toast('文件格式不正确，无法导入'); }
    finally{ e.target.value=''; }
  };
  reader.readAsText(file);
});

/* ==================== Tab 切换 ==================== */
function switchPage(name){
  $$('.page').forEach(p => p.classList.toggle('active', p.dataset.page === name));
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  if(name !== 'play') fxLayer.innerHTML = '';
  if(name === 'play'){
    if(state.sleeping) startZzz(); else stopZzz();
  }else{
    stopZzz();
  }
  if(name === 'log') renderLogs();
  if(name === 'info') renderInfo();
}

$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    switchPage(tab.dataset.tab);
    beep(520, .06, 'sine', .022);
  });
});

/* ==================== 点击鲸鱼 ==================== */
whaleHolder.addEventListener('pointerdown', e => {
  const r = fxLayer.getBoundingClientRect();
  heartAt(e.clientX - r.left, e.clientY - r.top);
  beep(660, .08, 'sine', .035);
  whale.animate([
    { transform:'scale(1)' },
    { transform:'scale(1.05)' },
    { transform:'scale(1)' }
  ], { duration: 320, easing:'cubic-bezier(.34,1.56,.64,1)' });
  if(!state.sleeping){
    state.mood = clamp(state.mood + 1.5);
    render();
  }
}, { passive:true });

/* ==================== 眼睛跟随 ==================== */
let eyeTarget = { x:0, y:0 }, eyeCur = { x:0, y:0 };
stage.addEventListener('pointermove', e => {
  const r = whale.getBoundingClientRect();
  const cx = r.left + r.width * 0.3;
  const cy = r.top  + r.height * 0.45;
  const dx = e.clientX - cx, dy = e.clientY - cy;
  const d = Math.hypot(dx, dy) || 1;
  const k = Math.min(4.5, d * 0.028);
  eyeTarget.x = dx / d * k;
  eyeTarget.y = dy / d * k;
}, { passive:true });

function eyeLoop(){
  eyeCur.x += (eyeTarget.x - eyeCur.x) * 0.14;
  eyeCur.y += (eyeTarget.y - eyeCur.y) * 0.14;
  eyeFollow.setAttribute('transform',
    'translate(' + eyeCur.x.toFixed(2) + ',' + eyeCur.y.toFixed(2) + ')');
  requestAnimationFrame(eyeLoop);
}

/* ==================== 眨眼 ==================== */
function blinkLoop(){
  eyeBlink.classList.add('blink');
  setTimeout(() => eyeBlink.classList.remove('blink'), 105);
  setTimeout(blinkLoop, rand(2300, 6200));
}

/* ==================== 数值衰减 ==================== */
function tick(){
  if(state.sleeping){
    state.energy = clamp(state.energy + 6);
    state.hunger = clamp(state.hunger - 0.45);
    state.clean  = clamp(state.clean - 0.25);
    state.mood   = clamp(state.mood + 0.5);
  }else{
    state.hunger = clamp(state.hunger - 0.35);
    state.mood   = clamp(state.mood - 0.25);
    state.clean  = clamp(state.clean - 0.20);
    state.energy = clamp(state.energy - 0.30);
  }
  render();
  if($('.page[data-page="info"]').classList.contains('active')) renderInfo();
}

/* ==================== 背景 Canvas ==================== */
const canvas = $('#bg');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;

function resizeCanvas(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = canvas.getBoundingClientRect();
  W = r.width || window.innerWidth;
  H = r.height || window.innerHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

class Bubble{
  constructor(init){ this.reset(init); }
  reset(init){
    this.r  = 2.5 + Math.random() * Math.random() * 16;
    this.x  = Math.random() * W;
    this.y  = init ? Math.random() * H : H + this.r * 2;
    this.vy = 0.22 + this.r * 0.052;
    this.ph = Math.random() * Math.PI * 2;
    this.vp = 0.008 + Math.random() * 0.022;
    this.a  = 0.10 + Math.random() * 0.36;
  }
  update(dt){
    this.y -= this.vy * dt;
    this.ph += this.vp * dt;
    this.x += Math.sin(this.ph) * 0.55 * dt;
    if(this.y < -this.r * 2 || this.x < -50 || this.x > W + 50) this.reset(false);
  }
  draw(){
    const x = this.x, y = this.y, r = this.r, a = this.a;
    const g = ctx.createRadialGradient(x - r*0.32, y - r*0.32, r*0.08, x, y, r);
    g.addColorStop(0, 'rgba(205,248,255,' + (a * 0.42) + ')');
    g.addColorStop(0.72, 'rgba(120,205,255,' + (a * 0.10) + ')');
    g.addColorStop(1, 'rgba(90,180,255,0)');
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(175,238,255,' + a + ')';
    ctx.lineWidth = Math.max(0.7, r * 0.075); ctx.stroke();
    ctx.beginPath(); ctx.arc(x - r*0.34, y - r*0.34, Math.max(0.6, r*0.2), 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, a * 1.5) + ')'; ctx.fill();
  }
}

const bubbles = [];
function initBubbles(){
  bubbles.length = 0;
  const n = Math.max(18, Math.min(Math.round(W * H / 15000), 90));
  for(let i = 0; i < n; i++) bubbles.push(new Bubble(true));
}

function drawRays(t){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(let i = 0; i < 5; i++){
    const base = (i + 0.5) / 5;
    const sway = Math.sin(t * 0.00018 + i * 1.7) * 0.04;
    const x = W * (base + sway);
    const w = W * (0.05 + (i % 3) * 0.022);
    const g = ctx.createLinearGradient(x, -40, x + w * 1.4, H);
    g.addColorStop(0, 'rgba(140,225,255,0.055)');
    g.addColorStop(0.45, 'rgba(110,205,255,0.028)');
    g.addColorStop(1, 'rgba(80,180,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - w, -40);
    ctx.lineTo(x + w, -40);
    ctx.lineTo(x + w * 2.6, H);
    ctx.lineTo(x - w * 2.6, H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

const motes = [];
function initMotes(){
  motes.length = 0;
  const n = Math.max(16, Math.min(Math.round(W * H / 26000), 50));
  for(let i = 0; i < n; i++){
    motes.push({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.6 + Math.random() * 1.9,
      ph: Math.random() * Math.PI * 2,
      sp: 0.004 + Math.random() * 0.012,
      vy: 0.08 + Math.random() * 0.22,
      a: 0.15 + Math.random() * 0.5
    });
  }
}
function drawMotes(dt, t){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const m of motes){
    m.ph += m.sp * dt;
    m.y -= m.vy * dt;
    m.x += Math.sin(m.ph) * 0.35 * dt;
    if(m.y < -6){ m.y = H + 6; m.x = Math.random() * W; }
    const tw = 0.55 + 0.45 * Math.sin(t * 0.0016 + m.ph * 3);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(170,235,255,' + (m.a * tw) + ')'; ctx.fill();
  }
  ctx.restore();
}

let lastT = 0;
function loop(t){
  if(!lastT) lastT = t;
  const dt = Math.min((t - lastT) / 16.667, 3);
  lastT = t;
  ctx.clearRect(0, 0, W, H);
  drawRays(t);
  for(const b of bubbles){ b.update(dt); b.draw(); }
  drawMotes(dt, t);
  requestAnimationFrame(loop);
}

/* ==================== 启动 ==================== */
function boot(){
  load();
  $('#petName').textContent = state.name;
  buildRings();
  renderTop();
  render();
  renderLogs();

  resizeCanvas();
  initBubbles();
  initMotes();
  requestAnimationFrame(loop);
  requestAnimationFrame(eyeLoop);
  setTimeout(blinkLoop, 1600);

  setInterval(tick, 2000);
  setInterval(save, 10000);

  window.addEventListener('resize', () => {
    resizeCanvas(); initBubbles(); initMotes();
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { resizeCanvas(); initBubbles(); initMotes(); }, 260);
  });
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
}

boot();
})();
